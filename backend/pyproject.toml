[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "geoalchemy2>=0.20.0",
    "psycopg2>=2.9.12",
    "pydantic-settings>=2.15.0",
    "ruff>=0.16.4",
    "shapely>=2.1.2",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
[tool.pyright]
typeCheckingMode = "standard"  # Changes from "strict" to "standard"
reportMissingTypeStubs = false  # Stops complaining about third-party libraries
